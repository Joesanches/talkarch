# Конфигурация Synapse для разработки PoC. Секреты ниже — только для локальной разработки.
server_name: konsilium.test
public_baseurl: http://localhost:8008/
pid_file: /data/homeserver.pid
signing_key_path: /data/signing.key
media_store_path: /data/media_store
log_config: /config/log.yaml
report_stats: false
suppress_key_server_warning: true
trusted_key_servers: []

listeners:
  - port: 8008
    type: http
    tls: false
    x_forwarded: true
    bind_addresses: ["0.0.0.0"]
    resources:
      - names: [client]
        compress: false

database:
  name: psycopg2
  args:
    user: synapse
    password: synapse-dev
    database: synapse
    host: postgres
    cp_min: 2
    cp_max: 10

# Регистрация только через admin API (общий секрет) — для тестовых пользователей.
enable_registration: false
registration_shared_secret: "dev-only-registration-shared-secret"
macaroon_secret_key: "dev-only-macaroon-secret-key"
form_secret: "dev-only-form-secret"

# Сервис клинического контекста как Application Service.
app_service_config_files:
  - /config/appservice-ccs.yaml

# Федерация в окружении разработчика выключена (пустой список разрешённых серверов).
federation_domain_whitelist: []
# Push-шлюз в контуре (apps/push-gateway) — в частной сети Docker, а к частным адресам push-шлюзов Synapse по умолчанию
# не ходит. Разрешаем сети Docker; федерация выключена, предпросмотр ссылок тоже — других запросов наружу нет.
ip_range_whitelist:
  - 172.16.0.0/12
# Push-шлюзу — тип события и настройки правил, без содержимого и имён (docs/03-architecture.md, раздел 6).
push:
  include_content: false

# Щадящие лимиты для тестов.
rc_message:
  per_second: 50
  burst_count: 100
rc_login:
  address: { per_second: 10, burst_count: 100 }
  account: { per_second: 10, burst_count: 100 }
  failed_attempts: { per_second: 10, burst_count: 100 }
rc_joins:
  local: { per_second: 50, burst_count: 100 }
rc_invites:
  per_room: { per_second: 50, burst_count: 100 }
  per_user: { per_second: 50, burst_count: 100 }

# Контекст случая и статусы критических находок видны и в приглашении: клиент показывает карточку, счётчики и «!» до входа в чат.
room_prejoin_state:
  additional_event_types:
    - ru.vendor.case.context
    # Статусы критических находок: приглашённый эскалацией сразу видит в списке, что его ждёт находка.
    - ru.vendor.critical.status
    # Архив: вернувшийся в архивный чат видит в приглашении, что чат только для чтения.
    - ru.vendor.case.archive

# Единый вход через Keycloak (OIDC). Логин в Keycloak = локальная часть Matrix ID — как в подключениях РИС/ЛИС;
# существующие учётные записи (созданные pnpm dev:users) связываются автоматически.
# Браузер ходит на localhost:8180, Synapse — напрямую в контейнер keycloak, поэтому адреса заданы явно.
oidc_providers:
  - idp_id: keycloak
    idp_name: "учётную запись организации"
    issuer: "http://localhost:8180/realms/konsilium"
    discover: false
    # Только для разработки: адреса Keycloak по http. На стенде и в продукте — https и проверки включены.
    skip_verification: true
    authorization_endpoint: "http://localhost:8180/realms/konsilium/protocol/openid-connect/auth"
    token_endpoint: "http://keycloak:8080/realms/konsilium/protocol/openid-connect/token"
    userinfo_endpoint: "http://keycloak:8080/realms/konsilium/protocol/openid-connect/userinfo"
    jwks_uri: "http://keycloak:8080/realms/konsilium/protocol/openid-connect/certs"
    client_id: synapse
    client_secret: "dev-only-oidc-client-secret-0123456789"
    client_auth_method: client_secret_post
    scopes: ["openid", "profile"]
    allow_existing_users: true
    user_mapping_provider:
      config:
        localpart_template: "{{ user.preferred_username }}"
        display_name_template: "{{ user.family_name }} {{ user.given_name }}"

# Веб-клиент разработки — без промежуточной страницы «Продолжить в …» после входа.
sso:
  client_whitelist:
    - "http://localhost:5173/"

