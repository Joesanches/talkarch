# Окружение разработчика PoC: PostgreSQL + Synapse + LiveKit + Keycloak (единый вход).
# Сервис контекста (apps/ccs) запускается на хосте: pnpm dev:ccs — Synapse ходит к нему через host.docker.internal.
# Профиль ai — ИИ-«Секретарь» на процессоре: распознавание речи (Vosk), LLM (llama.cpp) и агент стенограммы:
#   docker compose --profile ai up -d   (нужно ~10 ГБ памяти и ~9 ГБ на диске)
# Все секреты здесь — только для разработки.
name: konsilium-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse-dev
      POSTGRES_DB: synapse
      # Synapse требует сортировку C.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    # Порт для сервиса контекста на хосте (база ccs); 55432 — чтобы не мешать локальному PostgreSQL.
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Однократно создаёт ключ подписи сервера в томе synapse-data.
  synapse-keys:
    image: matrixdotorg/synapse:v1.162.0
    entrypoint: ["python", "-m", "synapse.app.homeserver"]
    command: ["-c", "/config/homeserver.yaml", "--generate-keys"]
    volumes:
      - ./synapse:/config:ro
      - synapse-data:/data

  synapse:
    image: matrixdotorg/synapse:v1.162.0
    entrypoint: ["python", "-m", "synapse.app.homeserver"]
    command: ["-c", "/config/homeserver.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
      synapse-keys:
        condition: service_completed_successfully
    ports:
      - "8008:8008"
    volumes:
      - ./synapse:/config:ro
      - synapse-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8008/health"]
      interval: 2s
      timeout: 3s
      retries: 60

  # Единый вход (OIDC): realm konsilium с теми же вымышленными пользователями, что в песочнице, пароль dev-only-password-1.
  # Консоль администратора — http://localhost:8180/admin (admin / dev-only-keycloak-admin).
  # В продукте Keycloak организации подключается к AD/LDAP (федерация пользователей), см. docs/07-security-compliance.md.
  keycloak:
    # Тот же образ, что quay.io/keycloak/keycloak (Apache-2.0), — зеркало на Docker Hub.
    image: keycloak/keycloak:26.4@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev-only-keycloak-admin
      # Браузер ходит на localhost:8180, Synapse — по внутреннему адресу keycloak:8080; издатель токенов — всегда первый.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-konsilium.json:/opt/keycloak/data/import/realm-konsilium.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 60

  # Режим --dev: ключ devkey / секрет secret. Не для продуктива.
  livekit:
    image: livekit/livekit-server:v1.13
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  # ── Профиль ai ────────────────────────────────────────────────────────
  # Распознавание русской речи: vosk-server с моделью kaldi-ru (Apache-2.0), WebSocket :2700. ~6 ГБ памяти.
  vosk:
    profiles: [ai]
    image: alphacep/kaldi-ru@sha256:02a2656ab505026cd1f6a2751c1d880bce30068150a4a1e10acd29eb65ecf650
    ports:
      - "2700:2700"
    healthcheck:
      # Модель грузится около минуты; до этого соединения сбрасываются.
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 2700), 2)"]
      interval: 5s
      timeout: 3s
      retries: 60

  # LLM для черновика протокола: Docker Model Runner (llama.cpp), OpenAI-совместимый API на :12434/engines/v1.
  llm:
    profiles: [ai]
    image: docker/model-runner@sha256:5bdc2bac71c1b70453f7dec5b527031bc6d8d99b8d1b2a10a8bcca073ae257a3
    ports:
      - "12434:12434"
    volumes:
      - models:/models

  # Однократно скачивает модель (Qwen3 1.7B, Apache-2.0, ~1,1 ГБ) в том models.
  llm-model:
    profiles: [ai]
    image: docker/model-runner@sha256:5bdc2bac71c1b70453f7dec5b527031bc6d8d99b8d1b2a10a8bcca073ae257a3
    entrypoint: ["curl", "-fsS", "--retry", "30", "--retry-all-errors", "--retry-delay", "2", "-X", "POST", "http://llm:12434/models/create", "-d", '{"from":"${LLM_MODEL:-ai/qwen3:1.7b-q4_K_M}"}']
    depends_on:
      - llm

  # Агент стенограммы: подключается к звонку LiveKit только на приём, распознаёт каждую дорожку, отдаёт результат сервису контекста.
  secretary:
    profiles: [ai]
    build:
      context: ../apps/secretary
      secrets: [build_ca]
    environment:
      SECRETARY_TOKEN: dev-only-secretary-token-0123456789
      ASR_URL: ws://vosk:2700
    ports:
      - "8070:8070"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      vosk:
        condition: service_healthy

secrets:
  # Корневой сертификат корпоративного прокси для сборки агента (если нужен): BUILD_CA_FILE=/путь/к/ca.crt.
  build_ca:
    file: ${BUILD_CA_FILE:-/dev/null}

volumes:
  pgdata: {}
  synapse-data: {}
  models: {}
