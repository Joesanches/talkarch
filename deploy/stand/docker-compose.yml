# Тестовый стенд «Консилиума». Запуск — через ./stand.sh (он генерирует .env и generated/).
name: konsilium-stand

x-app: &app
  image: konsilium-stand-app:latest
  build:
    context: ../..
    dockerfile: deploy/stand/Dockerfile
    target: app
    secrets: [build_ca]
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${PG_PASSWORD:?запустите ./stand.sh init}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 3s
      timeout: 3s
      retries: 30

  synapse-keys:
    image: matrixdotorg/synapse:v1.162.0
    entrypoint: ["python", "-m", "synapse.app.homeserver"]
    command: ["-c", "/config/homeserver.yaml", "--generate-keys"]
    volumes:
      - ./generated/synapse:/config:ro
      - synapse-data:/data

  synapse:
    image: matrixdotorg/synapse:v1.162.0
    restart: unless-stopped
    entrypoint: ["python", "-m", "synapse.app.homeserver"]
    # workers.yaml — добавка для WORKERS=on (репликация, Valkey, запись событий в воркерах); иначе пустая.
    command: ["-c", "/config/homeserver.yaml", "-c", "/config/workers.yaml"]
    depends_on:
      postgres: { condition: service_healthy }
      synapse-keys: { condition: service_completed_successfully }
      valkey: { condition: service_healthy, required: false }
    volumes:
      - ./generated/synapse:/config:ro
      - synapse-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8008/health"]
      interval: 3s
      timeout: 3s
      retries: 60

  livekit:
    image: livekit/livekit-server:v1.13
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./generated/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
      - "3478:3478/udp"

  ccs:
    <<: *app
    command: ["node", "--import", "tsx", "apps/ccs/src/index.ts"]
    env_file: ./generated/ccs.env
    volumes:
      - ./generated/connectors.json:/config/connectors.json:ro
    depends_on:
      synapse: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40

  host-mock:
    <<: *app
    command: ["node", "--import", "tsx", "apps/host-mock/src/index.ts"]
    env_file: ./generated/host-mock.env
    depends_on:
      ccs: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8090/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Push-шлюз в контуре: сервер сообщений шлёт ему уведомления во внутренней сети; приложения держат прямое соединение
  # через Caddy (/push/v1/connect), вне сети — внешние сервисы по PUSH_EXTERNAL (docs/03-architecture.md, раздел 6).
  push-gateway:
    <<: *app
    command: ["node", "--import", "tsx", "apps/push-gateway/src/index.ts"]
    env_file: ./generated/push-gateway.env
    volumes:
      - ./generated/push-keys:/config/push-keys:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8075/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40

  web:
    image: konsilium-stand-web:latest
    build:
      context: ../..
      dockerfile: deploy/stand/Dockerfile
      target: web
      secrets: [build_ca]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      TLS_MODE: ${TLS_MODE:-acme}
      EMBED_ORIGINS: ${EMBED_ORIGINS:-}
      # Синхронизация — воркерам синхронизации (WORKERS=on) или главному процессу Synapse.
      SYNAPSE_SYNC_UPSTREAMS: ${SYNAPSE_SYNC_UPSTREAMS:-synapse:8008}
    volumes:
      - ./generated/config.json:/srv/config.json:ro
      - ./generated/caddy-global.caddy:/etc/caddy/global.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      ccs: { condition: service_healthy }
      push-gateway: { condition: service_healthy }

  # ── Synapse с воркерами (WORKERS=on → профиль workers) ────────────────
  # Схема — infra/synapse/workers: 2 воркера синхронизации, 2 воркера записи событий, Valkey (BSD-3, замена Redis).
  valkey:
    profiles: [workers]
    image: valkey/valkey:8.1-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  synapse-sync1: &synapse-worker
    profiles: [workers]
    image: matrixdotorg/synapse:v1.162.0
    restart: unless-stopped
    entrypoint: ["python", "-m", "synapse.app.generic_worker"]
    command: ["-c", "/config/homeserver.yaml", "-c", "/config/workers.yaml", "-c", "/config/workers/sync1.yaml"]
    depends_on:
      synapse: { condition: service_healthy }
    volumes:
      - ./generated/synapse:/config:ro
      - synapse-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8008/health"]
      interval: 3s
      timeout: 3s
      retries: 60
  synapse-sync2:
    <<: *synapse-worker
    command: ["-c", "/config/homeserver.yaml", "-c", "/config/workers.yaml", "-c", "/config/workers/sync2.yaml"]
  synapse-persister1:
    <<: *synapse-worker
    command: ["-c", "/config/homeserver.yaml", "-c", "/config/workers.yaml", "-c", "/config/workers/persister1.yaml"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9093/health"]
      interval: 3s
      timeout: 3s
      retries: 60
  synapse-persister2:
    <<: *synapse-worker
    command: ["-c", "/config/homeserver.yaml", "-c", "/config/workers.yaml", "-c", "/config/workers/persister2.yaml"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9093/health"]
      interval: 3s
      timeout: 3s
      retries: 60

  # ── Единый вход (SSO=keycloak → профиль sso) ──────────────────────────
  # База keycloak в том же PostgreSQL: создаётся один раз.
  keycloak-db:
    profiles: [sso]
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${PG_PASSWORD}
    entrypoint: ["sh", "-c", "psql -h postgres -U synapse -d synapse -tAc \"select 1 from pg_database where datname='keycloak'\" | grep -q 1 || psql -h postgres -U synapse -d synapse -c 'create database keycloak'"]
    depends_on:
      postgres: { condition: service_healthy }

  # Keycloak (Apache-2.0) за Caddy по адресу https://<домен>/auth. Realm konsilium с демо-пользователями импортируется
  # при первом запуске. В продукте вместо него — Keycloak организации с федерацией в AD/LDAP.
  keycloak:
    profiles: [sso]
    image: keycloak/keycloak:26.4@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: synapse
      KC_DB_PASSWORD: ${PG_PASSWORD}
      KC_HOSTNAME: https://${DOMAIN}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Synapse обращается к Keycloak напрямую, внутри сети стенда; издатель токенов — публичный адрес.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-}
    volumes:
      - ./generated/realm-konsilium.json:/opt/keycloak/data/import/realm-konsilium.json:ro
    depends_on:
      keycloak-db: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 90

  # ── ИИ-«Секретарь» (AI=cpu → COMPOSE_PROFILES=ai) ──────────────────────
  # Распознавание русской речи: vosk-server с моделью kaldi-ru (Apache-2.0). ~6 ГБ памяти.
  vosk:
    profiles: [ai]
    image: alphacep/kaldi-ru@sha256:02a2656ab505026cd1f6a2751c1d880bce30068150a4a1e10acd29eb65ecf650
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 2700), 2)"]
      interval: 5s
      timeout: 3s
      retries: 60

  # LLM для черновика протокола: Docker Model Runner (llama.cpp), OpenAI-совместимый API.
  llm:
    profiles: [ai]
    image: docker/model-runner@sha256:5bdc2bac71c1b70453f7dec5b527031bc6d8d99b8d1b2a10a8bcca073ae257a3
    restart: unless-stopped
    environment:
      SSL_CERT_FILE: ${LLM_SSL_CERT_FILE:-}
    volumes:
      - models:/models
      - ${BUILD_CA_FILE:-/dev/null}:/etc/konsilium/ca.crt:ro

  # Однократно скачивает модель в том models (при повторных запусках — из кеша).
  llm-model:
    profiles: [ai]
    image: docker/model-runner@sha256:5bdc2bac71c1b70453f7dec5b527031bc6d8d99b8d1b2a10a8bcca073ae257a3
    entrypoint: ["curl", "-fsS", "--retry", "30", "--retry-all-errors", "--retry-delay", "2", "-X", "POST", "http://llm:12434/models/create", "-d", '{"from":"ai/qwen3:1.7b-q4_K_M"}']
    depends_on: [llm]

  # Агент стенограммы: в звонке только на приём, распознаёт дорожку каждого участника.
  secretary:
    profiles: [ai]
    image: konsilium-stand-secretary:latest
    build:
      context: ../../apps/secretary
      secrets: [build_ca]
    restart: unless-stopped
    environment:
      SECRETARY_TOKEN: ${SECRETARY_TOKEN:-}
      ASR_URL: ws://vosk:2700
    depends_on:
      vosk: { condition: service_healthy }
      llm-model: { condition: service_completed_successfully }

secrets:
  # Корневой сертификат корпоративного прокси для сборки (если нужен): BUILD_CA_FILE=/путь/к/ca.crt в .env.
  build_ca:
    file: ${BUILD_CA_FILE:-/dev/null}

volumes:
  pgdata: {}
  synapse-data: {}
  caddy-data: {}
  caddy-config: {}
  models: {}
