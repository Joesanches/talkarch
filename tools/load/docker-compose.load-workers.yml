# Нагрузочный стенд на Synapse с воркерами (infra/docker-compose.workers.yml): маршрутизатор — на порту 18008.
#   docker compose -p konsilium-load -f infra/docker-compose.yml -f infra/docker-compose.workers.yml \
#     -f tools/load/docker-compose.load.yml -f tools/load/docker-compose.load-workers.yml up -d synapse-router
services:
  synapse:
    ports: !reset []
  synapse-router:
    ports: !override
      - "18008:8008"
