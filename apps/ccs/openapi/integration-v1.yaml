openapi: 3.1.0
info:
  title: «Консилиум» — API интеграции для РИС, ЛИС и ТМК
  version: 1.0.0-poc
  summary: Система-источник сообщает сервису контекста о случаях, заявках, уведомлениях и критических находках.
  description: |
    Это API вызывает **система-источник** (РИС, ЛИС, ТМК). Обратное направление — вызовы из сервиса контекста
    в систему-источник — описано в `host-callbacks-v1.yaml`.

    Подробно о модели, уровнях интеграции и адаптерах для систем других производителей — `docs/10-integration-api.md`.

    Главное:
    - события — в формате **CloudEvents 1.0** (структурированный JSON); `id` — ключ идемпотентности, `source` — идентификатор подключения;
    - снимок случая (`case.upserted`) всегда полный, его `version` растёт при любом изменении;
    - каждое событие в пакете получает свой итог; при временных ошибках ответ — `503`, пакет можно повторить целиком;
    - ошибки уровня запроса — в формате RFC 9457 (`application/problem+json`);
    - изменения в рамках `v1` только добавочные: неизвестные поля в ответах нужно игнорировать.
  contact:
    name: Команда «Консилиума»
servers:
  - url: http://localhost:8080/integration/v1
    description: Окружение разработчика
  - url: https://chat.clinic.local/integration/v1
    description: Пример продуктивного адреса
security:
  - connectorToken: []
tags:
  - name: События
    description: Случаи, статусы заявок, уведомления и критические находки из системы-источника
  - name: Критические находки
    description: Время подтверждения и эскалации — отчёт и способ узнать итог без обратных вызовов
  - name: Чаты случаев
    description: Есть ли чат по случаю; создание чата по запросу системы-источника
  - name: Служебное
    description: Проверка настройки подключения
paths:
  /connector:
    get:
      tags: [Служебное]
      operationId: getConnector
      summary: Кто я — проверка настройки подключения
      responses:
        '200':
          description: Подключение, от имени которого выполнен запрос
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorInfo' }
              examples:
                lis: { $ref: '#/components/examples/ConnectorInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /events:
    post:
      tags: [События]
      operationId: postEvents
      summary: Отправить событие или пакет событий
      description: |
        События одного случая (`data.case_id`) применяются в порядке пакета, разных случаев — параллельно; итог по каждому событию — в `results` в порядке пакета.

        | Итог | Что значит | Что делать |
        |---|---|---|
        | `accepted` | Принято и применено | — |
        | `duplicate` | Событие с этим `id` уже обработано | — |
        | `stale` | `version` меньше уже полученной | — |
        | `ignored` | Принято, но действий не требует (например, уведомление по случаю без чата) | — |
        | `rejected` | Не по контракту или противоречит данным; `detail` — причина | Исправить и отправить с новым `id` |
        | `failed` | Временная ошибка | Повторить (ответ при этом — `503`) |
      requestBody:
        required: true
        content:
          application/cloudevents-batch+json:
            schema: { $ref: '#/components/schemas/EventBatch' }
            examples:
              batch: { $ref: '#/components/examples/Batch' }
          application/cloudevents+json:
            schema: { $ref: '#/components/schemas/Event' }
            examples:
              caseUpserted: { $ref: '#/components/examples/CaseUpserted' }
              requestStatusChanged: { $ref: '#/components/examples/RequestStatusChanged' }
              notificationPosted: { $ref: '#/components/examples/NotificationPosted' }
              criticalRaised: { $ref: '#/components/examples/CriticalRaised' }
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Event'
                - $ref: '#/components/schemas/EventBatch'
      responses:
        '200':
          description: Пакет обработан; итоги — по каждому событию
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventsResponse' }
              examples:
                mixed: { $ref: '#/components/examples/EventsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: В пакете больше 100 событий
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Есть события с итогом `failed`. Повторите пакет после паузы из `Retry-After`; принятые события вернутся как `duplicate`.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Через сколько секунд повторить
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventsResponse' }
  /critical-findings:
    get:
      tags: [Критические находки]
      operationId: listCriticalFindings
      summary: Критические находки подключения — статус, время подтверждения, эскалации
      description: |
        Находки из `critical.raised` этого подключения и находки, отправленные в чатах его случаев.
        Для РИС/ЛИС уровня 1 (без обратных вызовов) — способ узнать о подтверждении; для всех — отчёт
        по времени подтверждения. Текста находки в ответе нет: он хранится в чате случая.
      parameters:
        - name: since
          in: query
          description: Находки, отправленные начиная с этого момента. По умолчанию — за последние 7 дней.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Находки по времени отправки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CriticalFindingsResponse' }
              examples:
                report: { $ref: '#/components/examples/CriticalFindingsResponse' }
        '400':
          description: Некорректный `since`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /cases/{caseId}/chat:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Чаты случаев]
      operationId: getCaseChat
      summary: Есть ли чат по случаю
      description: Для иконки «есть обсуждение» в карточке случая или рабочем списке. Счётчики непрочитанного — персональные, их даёт SDK встраивания в режиме `headless`.
      responses:
        '200':
          description: Сведения о чате; `chat` равен `null`, если чата нет
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatInfo' }
              examples:
                exists: { $ref: '#/components/examples/ChatInfo' }
                none: { $ref: '#/components/examples/ChatInfoNone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Чаты случаев]
      operationId: ensureCaseChat
      summary: Создать чат по случаю (идемпотентно)
      description: |
        Например, по кнопке «Обсудить» или при назначении консилиума. Обычно вызывать не нужно: чат создаётся сам,
        когда пользователь впервые открывает его из РИС/ЛИС. Участники по ролям приглашаются из последнего `case.upserted`.
      responses:
        '200':
          description: Чат уже был
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatInfo' }
        '201':
          description: Чат создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatInfo' }
              examples:
                created: { $ref: '#/components/examples/ChatInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Случай неизвестен — сначала отправьте `case.upserted`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  securitySchemes:
    connectorToken:
      type: http
      scheme: bearer
      description: |
        Токен подключения. В PoC — статический (сервис хранит только SHA-256).
        В продукте — OAuth 2.0 client credentials (Keycloak) или mTLS; см. docs/10-integration-api.md, раздел «Безопасность».
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      description: Номер случая (исследования, заказа) в системе-источнике. Регистр не важен.
      schema: { type: string, minLength: 1, maxLength: 128 }
  responses:
    BadRequest:
      description: Тело запроса — не событие и не массив событий
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Нет токена подключения или он неверный
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    ConnectorId:
      type: string
      pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
      description: Идентификатор подключения — конкретного экземпляра РИС, ЛИС или ТМК. Выдаёт администратор «Консилиума».
      examples: [lis, ris-gkb1]
    ConnectorInfo:
      type: object
      required: [id, kind, org, title, level]
      properties:
        id: { $ref: '#/components/schemas/ConnectorId' }
        kind: { $ref: '#/components/schemas/SourceSystem' }
        org: { type: string }
        title: { type: string }
        level:
          type: integer
          enum: [1, 2]
          description: 1 — только события; 2 — события и обратные вызовы
    SourceSystem:
      type: string
      enum: [RIS, LIS, TMK]
    CaseRole:
      type: string
      enum: [pathologist, radiologist, attending, lab_tech, radiographer, engineer, head, external_consultant, on_duty, viewer]
    CaseStatus:
      type: string
      enum: [open, closed, cancelled]
      default: open
    Priority:
      type: string
      enum: [routine, urgent, cito]
    RequestStep:
      type: string
      enum: [created, accepted, staining, scanning, done, rejected]
    UserRef:
      type: object
      description: |
        Пользователь глазами системы-источника. Нужен хотя бы один идентификатор.
        Сопоставление с учётной записью мессенджера: `mxid` → `login` → `idp_sub` → `employee_id`.
        Пользователь, ещё не входивший в мессенджер, получит приглашение при первом входе.
      properties:
        mxid: { type: string, pattern: '^@[^:\s]+:\S+$', description: 'Matrix ID, если известен' }
        login: { type: string, maxLength: 255, description: Логин в домене (AD/LDAP) — основной способ }
        idp_sub: { type: string, maxLength: 255, description: Идентификатор пользователя в Keycloak (claim sub) }
        employee_id: { type: string, maxLength: 64, description: Табельный номер }
        display_name: { type: string, maxLength: 200, description: Только для журналов и предупреждений }
      anyOf:
        - required: [mxid]
        - required: [login]
        - required: [idp_sub]
        - required: [employee_id]
    Participant:
      type: object
      required: [user, role]
      properties:
        user: { $ref: '#/components/schemas/UserRef' }
        role: { $ref: '#/components/schemas/CaseRole' }
    PatientRef:
      type: object
      additionalProperties: false
      required: [ref, masked]
      description: |
        Только псевдоним и маска. ФИО, дата рождения и номера документов в мессенджер не передаются —
        их по запросу отдаёт обратный вызов `patient-reveals` с записью в журнал системы-источника.
      properties:
        ref: { type: string, description: 'Стабильный псевдоним пациента (например, HMAC от идентификатора в МПИ)' }
        masked: { type: string, description: 'Маска для показа: первая буква фамилии и инициалы, «Н*** О. В.»' }
        age: { type: integer, minimum: 0, maximum: 130 }
        sex: { type: string, enum: [F, M, U] }
    CaseLinks:
      type: object
      properties:
        record: { type: string, format: uri, description: Карточка случая в системе-источнике }
        viewer: { type: string, format: uri, description: 'Вьюер (DICOM, WSI)' }
    CaseSnapshot:
      type: object
      description: Полный снимок случая. Что не передано — сброшено. Исключение — `revoked`, это явная команда.
      required: [case_id, version, title, patient, updated_at]
      properties:
        case_id: { type: string, minLength: 1, maxLength: 128 }
        version:
          type: integer
          minimum: 0
          description: Монотонно растущая версия — номер ревизии, rowversion или время изменения в миллисекундах. Растёт при любом изменении.
        status: { $ref: '#/components/schemas/CaseStatus' }
        title: { type: string, minLength: 1, maxLength: 200, description: 'Вид исследования или материала, без ФИО: «КТ-ангиопульмонография»' }
        patient: { $ref: '#/components/schemas/PatientRef' }
        order_id: { type: string, maxLength: 128 }
        accession_number: { type: string, maxLength: 64 }
        study_instance_uid: { type: string, pattern: '^[0-9]+(\.[0-9]+)*$', maxLength: 64 }
        stage: { type: string, maxLength: 64, description: 'Этап в терминах системы-источника (grossing, ihc, reporting…)' }
        priority: { $ref: '#/components/schemas/Priority' }
        due: { type: string, format: date-time }
        links: { $ref: '#/components/schemas/CaseLinks' }
        participants:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Participant' }
          description: Участники по ролям — их приглашают в чат случая
        access:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/UserRef' }
          description: Кому ещё можно открыть чат. Для уровня 1; на уровне 2 права проверяет обратный вызов `access-checks`.
        revoked:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/UserRef' }
          description: Отозвать доступ — пользователь будет выведен из чата
        updated_at: { type: string, format: date-time }
    RequestStatusChanged:
      type: object
      required: [case_id, external_id, status, changed_at]
      properties:
        case_id: { type: string }
        external_id: { type: string, maxLength: 64, description: 'Номер заявки, который система-источник вернула при её создании' }
        status: { $ref: '#/components/schemas/RequestStep' }
        steps:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/RequestStep' }
          description: Шаги для полосы прогресса; если не переданы — прежние
        note: { type: string, maxLength: 500 }
        changed_at: { type: string, format: date-time }
    NotificationLink:
      type: object
      required: [label, url]
      properties:
        label: { type: string, maxLength: 40 }
        url: { type: string, format: uri }
    NotificationPosted:
      type: object
      required: [case_id, text]
      properties:
        case_id: { type: string }
        text: { type: string, minLength: 1, maxLength: 2000, description: Без ФИО пациента }
        category: { type: string, enum: [info, ready, report, warning], default: info }
        links:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/NotificationLink' }
        ensure_chat:
          type: boolean
          default: false
          description: Создать чат, если его нет. По умолчанию уведомление по случаю без чата игнорируется.
    IsoDuration:
      type: string
      pattern: '^PT(\d+M)?(\d+S)?$'
      description: Длительность ISO 8601 в минутах и секундах — `PT10M`, `PT90S`, `PT1M30S`
      examples: [PT10M]
    CriticalRaised:
      type: object
      required: [case_id, finding_id, finding, reported_by, recipient]
      description: |
        Критическая находка. Сервис создаёт чат случая (если его нет), публикует находку от имени сервиса с указанием автора,
        приглашает адресатов и ведёт срок подтверждения. Подтвердить получение может только адресат или подключённый эскалацией.
        Итог — обратным вызовом `POST /critical-findings/events` (уровень 2) и в `GET /critical-findings`.
      properties:
        case_id: { type: string }
        finding_id: { type: string, maxLength: 128, description: 'Номер находки в системе-источнике; повтор с тем же номером — `duplicate`' }
        finding: { type: string, minLength: 1, maxLength: 1000, description: 'Суть находки, без ФИО пациента' }
        reported_by: { $ref: '#/components/schemas/UserRef' }
        recipient:
          type: object
          description: Роль адресата в случае и/или конкретные люди; нужно хотя бы одно
          properties:
            role: { $ref: '#/components/schemas/CaseRole' }
            users: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/UserRef' } }
        ack_deadline: { allOf: [{ $ref: '#/components/schemas/IsoDuration' }], default: PT10M }
        escalation:
          type: array
          maxItems: 5
          description: 'План эскалации; не задан — план подключения по умолчанию. `after` — от момента отправки.'
          items:
            type: object
            required: [after, action, target]
            properties:
              after: { $ref: '#/components/schemas/IsoDuration' }
              action:
                type: string
                enum: [notify, call]
                description: '`notify` — подключить к чату и уведомить; `call` — звонок на пост (выполняет система-источник по обратному вызову)'
              target: { type: string, maxLength: 200, description: 'Роль в случае (`head`) или название поста' }
              users: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/UserRef' } }
    CriticalFindingSummary:
      type: object
      required: [finding_id, case_id, status, raised_at, deadline_at, reported_by, overdue, escalations]
      properties:
        finding_id: { type: string, description: 'ID находки в «Консилиуме»' }
        host_finding_id: { type: string, description: 'Номер в системе-источнике, если находка пришла оттуда' }
        case_id: { type: string }
        status: { type: string, enum: [pending, acknowledged] }
        raised_at: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time }
        reported_by: { $ref: '#/components/schemas/UserRef' }
        acknowledged_by: { $ref: '#/components/schemas/UserRef' }
        acknowledged_at: { type: string, format: date-time }
        seconds_to_ack: { type: integer, minimum: 0 }
        overdue: { type: boolean, description: 'Подтверждена позже срока (или срок истёк, а подтверждения нет)' }
        escalations:
          type: array
          items:
            type: object
            required: [step, at, action, target]
            properties:
              step: { type: integer, minimum: 1 }
              at: { type: string, format: date-time }
              action: { type: string, enum: [notify, call] }
              target: { type: string }
    CriticalFindingsResponse:
      type: object
      required: [findings]
      properties:
        findings:
          type: array
          items: { $ref: '#/components/schemas/CriticalFindingSummary' }
    EventBase:
      type: object
      description: Конверт CloudEvents 1.0 (структурированный режим). Расширения CloudEvents (например, `traceparent`) допускаются.
      required: [specversion, id, source, type, data]
      properties:
        specversion: { const: '1.0' }
        id: { type: string, maxLength: 256, description: Уникален в пределах подключения; ключ идемпотентности }
        source: { $ref: '#/components/schemas/ConnectorId' }
        type: { type: string }
        time: { type: string, format: date-time }
        subject: { type: string, description: 'Рекомендуется: номер случая — для маршрутизации в брокерах' }
        datacontenttype: { const: application/json }
    CaseUpsertedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          properties:
            type: { const: ru.vendor.case.upserted }
            data: { $ref: '#/components/schemas/CaseSnapshot' }
    RequestStatusChangedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          properties:
            type: { const: ru.vendor.request.status.changed }
            data: { $ref: '#/components/schemas/RequestStatusChanged' }
    NotificationPostedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          properties:
            type: { const: ru.vendor.notification.posted }
            data: { $ref: '#/components/schemas/NotificationPosted' }
    CriticalRaisedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          properties:
            type: { const: ru.vendor.critical.raised }
            data: { $ref: '#/components/schemas/CriticalRaised' }
    Event:
      oneOf:
        - $ref: '#/components/schemas/CaseUpsertedEvent'
        - $ref: '#/components/schemas/RequestStatusChangedEvent'
        - $ref: '#/components/schemas/NotificationPostedEvent'
        - $ref: '#/components/schemas/CriticalRaisedEvent'
      discriminator:
        propertyName: type
        mapping:
          ru.vendor.case.upserted: '#/components/schemas/CaseUpsertedEvent'
          ru.vendor.request.status.changed: '#/components/schemas/RequestStatusChangedEvent'
          ru.vendor.notification.posted: '#/components/schemas/NotificationPostedEvent'
          ru.vendor.critical.raised: '#/components/schemas/CriticalRaisedEvent'
    EventBatch:
      type: array
      minItems: 1
      maxItems: 100
      items: { $ref: '#/components/schemas/Event' }
    EventResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [accepted, duplicate, stale, ignored, rejected, failed] }
        detail: { type: string }
        warnings: { type: array, items: { type: string } }
    EventsResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/EventResult' }
    ChatInfo:
      type: object
      required: [case_id, chat]
      properties:
        case_id: { type: string }
        chat:
          oneOf:
            - type: 'null'
